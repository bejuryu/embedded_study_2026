<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-P4 Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f5f7fa; --text: #1e293b; --muted: #64748b; --primary: #a7f3d0; --folder: #bae6fd; --file: #f1f5f9; --border: #1e293b; --ul: #fbcfe8; --err: #fecaca; --shadow: 4px 4px var(--border); --shadow-sm: 2px 2px var(--border); } * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; font-size: inherit; font-weight: inherit; } body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; font-size: 0.85rem; font-weight: 700; } .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; } svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; } header, .card, .speedtest-status, .breadcrumbs, .select, .metric-card, .history-item, .file-list-container { border: 2px solid var(--border); background: #ffffff; } header, .card, .speedtest-status { border-radius: 12px; box-shadow: var(--shadow); }
        .breadcrumbs, .select, .metric-card, .history-item, .file-list-container { border-radius: 8px; } header, h1, .header-status-area, .file-name-container, .card, .card-header, .actions-wrapper, .btn, .action-btn, .status-badge, .breadcrumbs, .speedtest-status, .history-item, .history-metrics-container, .actions-cell { display: flex; } header, h1, .header-status-area, .file-name-container, .btn, .action-btn, .status-badge { align-items: center; } header { justify-content: space-between; padding: 14px 20px; flex-wrap: wrap; gap: 10px; } h1 { font-size: 1.15rem; font-weight: 800; gap: 8px; } .header-status-area, .file-name-container { gap: 8px; } .grid { display: grid; grid-template-columns: 1.30fr 1fr; gap: 24px; } @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } } .card { padding: 20px; flex-direction: column; }
        .card-header { justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 2px solid var(--border); padding-bottom: 12px; } .card-title { font-size: 1.05rem; display: flex; align-items: center; gap: 6px; } .actions-wrapper { gap: 8px; align-items: center; } .btn, .action-btn, .status-badge { gap: 6px; } .btn, .action-btn { border: 2px solid var(--border); background: white; color: var(--text); transition: 0.1s ease; cursor: pointer; } .btn { padding: 8px 14px; border-radius: 8px; box-shadow: var(--shadow-sm); } .action-btn { padding: 4px; border-radius: 6px; box-shadow: 1px 1px var(--border); } .clickable, .upload-dropzone, .select, .breadcrumb-item { cursor: pointer; } .btn:hover:not(:disabled), .action-btn:hover { transform: translate(-1px, -1px); filter: brightness(0.95); } .btn:hover:not(:disabled) { box-shadow: 3px 3px var(--border); } .action-btn:hover { box-shadow: 2px 2px var(--border); } .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; } .action-btn:active { transform: translate(1px, 1px); box-shadow: none; }
        .btn:disabled { transform: none; box-shadow: none; opacity: 0.5; background: #e2e8f0; cursor: not-allowed; } .btn-primary { background: var(--primary); } .btn-toggle { padding: 4px 10px; font-size: 0.75rem; height: 26px; border-radius: 6px; justify-content: center; } .breadcrumbs { gap: 4px; padding: 8px 12px; margin-bottom: 12px; overflow-x: auto; white-space: nowrap; } .breadcrumb-item { color: #0369a1; } .breadcrumb-item:hover, .clickable:hover { text-decoration: underline; } .file-list-container { overflow-y: auto; max-height: 400px; } .file-table { width: 100%; border-collapse: collapse; } .file-table th { background: #f8fafc; padding: 10px; color: var(--text); border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 10; } .file-table td { padding: 10px; border-bottom: 1px solid var(--border); } .file-table th:nth-child(2), .file-table td:nth-child(2) { width: 80px; } .file-table th:nth-child(3), .file-table td:nth-child(3) { width: 90px; text-align: right; } .file-table th:nth-child(4), .file-table td:nth-child(4) { width: 80px; } .loading-cell { text-align: center; padding: 20px; color: var(--muted); }
        .type-badge { font-size: 0.7rem; padding: 2px 5px; border-radius: 4px; border: 2px solid var(--border); display: inline-block; color: var(--text); }
        .type-dir, .badge-https, .btn-speed-dl, .action-download { background: var(--folder); } .type-file, .btn-secondary { background: var(--file); } .badge-http { background: #ffe5d9; } .action-delete { background: var(--err); } .actions-cell { gap: 6px; justify-content: flex-end; }
        .upload-dropzone { border: 2px dashed var(--border); padding: 16px; text-align: center; margin-top: 12px; background: #fafafb; transition: 0.15s ease; }
        .upload-dropzone:hover { background: #f0fdf4; border-style: solid; }
        .dropzone-sub { color: var(--muted); margin-top: 4px; font-weight: 500; }
        .speedtest-select-container { margin-bottom: 16px; }
        .select { padding: 8px 12px; width: 100%; outline: none; }
        .metrics-grid, .speedtest-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .speedtest-actions { margin: 15px 0; }
        .btn-speed-ul { background: var(--ul); }
        .speedtest-status { padding: 16px; flex-direction: column; gap: 12px; }
        .progress-header { display: flex; justify-content: space-between; color: var(--muted); }
        .progress-container { width: 100%; height: 12px; background: #ffffff; border: 2px solid var(--border); border-radius: 6px; overflow: hidden; }
        .progress-wrapper { margin-top: 6px; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.1s linear; border-right: 2px solid var(--border); }
        .progress-bar.dl { background: var(--folder); } .progress-bar.ul { background: var(--ul); }
        .metric-card { padding: 10px; text-align: center; }
        .metric-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 2px; }
        .metric-value { font-size: 1.1rem; font-weight: 800; }
        .metric-value span { font-size: 0.75rem; color: var(--muted); margin-left: 1px; }
        .stats-value { font-size: 0.95rem; line-height: 1.5; font-weight: 800; }
        .stats-value span { font-size: 0.75rem; color: var(--muted); margin-left: 1px; }
        .history-container { margin-top: 8px; border-top: 2px solid var(--border); padding-top: 12px; }
        .history-header { justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
        .btn-clear-history { background: none; border: none; color: var(--muted); font-size: 0.75rem; cursor: pointer; text-decoration: underline; }
        .history-list { max-height: 140px; overflow-y: auto; flex-direction: column; gap: 12px; }
        .history-empty { color: var(--muted); text-align: center; padding: 8px; font-size: 0.75rem; font-weight: 500; }
        .history-item { display: grid; grid-template-columns: 60px 65px 80px 90px 85px 1fr; column-gap: 8px; align-items: center; padding: 10px 12px; font-size: 0.75rem; }
        .history-size-label { color: var(--muted); } .history-time-label { text-align: right; } .history-max-label, .history-time-label { color: var(--muted); font-size: 0.65rem; font-weight: 500; } .type-dl { color: #0284c7; } .type-ul { color: #b91c1c; }
        .status-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; background: #fef08a; color: var(--text); border: 2px solid var(--border); }
        .status-badge.online { background: #dcfce7; }
        .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .icon-primary { color: var(--primary); }
        .icon-folder-color { color: var(--folder); }
        .icon-file-color { color: var(--file); }
        .hidden-svg { display: none; }
        .hidden { display: none !important; }
        #toast { position: fixed; bottom: 20px; right: 20px; background: var(--err); border: 2px solid var(--border); padding: 10px 20px; border-radius: 8px; box-shadow: var(--shadow-sm); z-index: 100; }
        #newFolderInput { margin: 0; padding: 4px 8px; width: 110px; font-size: 0.8rem; height: 32px; font-weight: 500; }
        h1 svg { width: 22px; height: 22px; } .card-title svg { width: 18px; height: 18px; } .file-name-container svg { width: 16px; height: 16px; } .btn svg, .action-btn svg { width: 14px; height: 14px; }
    </style>
</head>
<body>
<svg class="hidden-svg">
  <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="icon-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
  <symbol id="icon-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="icon-server" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></symbol>
</svg>
<div class="container">
    <header>
        <h1><svg class="icon-primary"><use href="#icon-server"/></svg> M5Stack Tab5 웹 관리 패널</h1>
        <div class="header-status-area">
            <div id="protocolStatus" class="status-badge"></div>
            <button id="btnProtocolToggle" class="btn btn-secondary btn-toggle"></button>
            <div id="connectionStatus" class="status-badge"><span class="dot"></span><span class="status-text">서버 연결 중...</span></div>
        </div>
    </header>
    <div class="grid">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><svg class="icon-folder-color"><use href="#icon-folder"/></svg> SD 카드 탐색기</h2>
                <div class="actions-wrapper">
                    <input id="newFolderInput" type="text" class="breadcrumbs hidden" placeholder="폴더명 + Enter">
                    <button id="btnNewFolder" class="btn btn-secondary"><svg><use href="#icon-plus"/></svg> 새 폴더</button>
                    <input type="file" id="fileInput" class="hidden" multiple>
                    <button id="btnUploadFile" class="btn btn-primary"><svg><use href="#icon-upload"/></svg> 파일 업로드</button>
                </div>
            </div>
            <div class="breadcrumbs" id="breadcrumbs">📁 Root</div>
            <div class="file-list-container">
                <table class="file-table">
                    <thead><tr><th>이름</th><th>속성</th><th>크기</th><th>동작</th></tr></thead>
                    <tbody id="fileListBody"></tbody>
                </table>
            </div>
            <div class="upload-dropzone" id="dropzone"><strong>업로드할 파일을 여기에 끌어다 놓으세요.</strong><p class="dropzone-sub">또는 클릭하여 파일 선택</p></div>
        </div>
        <div class="card">
            <div class="card-header"><h2 class="card-title"><svg class="icon-primary"><use href="#icon-server"/></svg> 대역폭 네트워크 테스트</h2></div>
            <div class="speedtest-select-container">
                <select id="testSize" class="select">
                    <option value="5" selected>5 MB (가벼운 다운/업 측정)</option>
                    <option value="10">10 MB (표준 다운/업 측정)</option>
                    <option value="50">50 MB (고정밀 속도 측정)</option>
                    <option value="100">100 MB (대용량 스트리밍 부하 테스트)</option>
                    <option value="1024">1 GB (초고속 대용량 스트리밍 부하 테스트)</option>
                </select>
            </div>
            <div class="speedtest-actions">
                <button id="btnDl" class="btn btn-speed-dl"><svg><use href="#icon-download"/></svg> 다운로드 테스트</button>
                <button id="btnUl" class="btn btn-speed-ul"><svg><use href="#icon-upload"/></svg> 업로드 테스트</button>
            </div>
            <div class="speedtest-status">
                <div class="progress-header"><span id="testStateText">테스트 준비 완료</span><span id="testProgressPercent">0%</span></div>
                <div class="progress-container progress-wrapper"><div id="testProgressBar" class="progress-bar"></div></div>
                <div class="metrics-grid">
                    <div class="metric-card"><div class="metric-label">현재 속도</div><div id="metricCurrent" class="metric-value">0.00<span>Mbps</span></div></div>
                    <div class="metric-card"><div class="metric-label">최대 속도</div><div id="metricMax" class="metric-value">0.00<span>Mbps</span></div></div>
                    <div class="metric-card"><div class="metric-label">평균 속도</div><div id="metricAvg" class="metric-value">0.00<span>Mbps</span></div></div>
                    <div class="metric-card"><div class="metric-label">시간 / 전송량</div><div id="metricStats" class="metric-value stats-value">0.0s <span>/ 0.0MB</span></div></div>
                </div>
                <div class="history-container">
                    <div class="history-header"><span>최근 측정 기록 (History)</span><button id="btnClearHistory" class="btn-clear-history">기록 삭제</button></div>
                    <div id="historyList" class="history-list"><div class="history-empty">측정 기록이 없습니다.</div></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const $ = id => document.getElementById(id), loc = window.location, protoStr = loc.protocol.slice(0, -1).toUpperCase();
    const connStatus = $("connectionStatus"), protoStatus = $("protocolStatus"), btnProtocolToggle = $("btnProtocolToggle"),
          newFolderInput = $("newFolderInput"), fileInput = $("fileInput"), fileListBody = $("fileListBody"), breadcrumbs = $("breadcrumbs"),
          testProgressBar = $("testProgressBar"), testProgressPercent = $("testProgressPercent"), dropzone = $("dropzone"),
          metricCurrent = $("metricCurrent"), metricMax = $("metricMax"), metricAvg = $("metricAvg"), metricStats = $("metricStats"),
          historyList = $("historyList"), testStateText = $("testStateText"), btnDl = $("btnDl"), btnUl = $("btnUl"), testSize = $("testSize");
    let currentPath = "/", isTesting = false, testHistory = [], toastTimer;
    const enc = encodeURIComponent, getFullPath = n => currentPath + (currentPath.endsWith("/") ? "" : "/") + n;
    const apiUri = (n = "") => `/api/files?path=${enc(n ? getFullPath(n) : currentPath)}&_t=${Date.now()}`;
    const setHtml = (el, html) => el.innerHTML = html, setVal = (el, v, u = "Mbps") => setHtml(el, `${v}${u ? '<span>' + u + '</span>' : ''}`);
    const setConnStatus = (online, text) => (connStatus.className = `status-badge ${online ? 'online' : 'badge-http'}`, setHtml(connStatus, `<span class="dot"></span>${text}`));
    const showErr = msg => {
        const el = $("toast") || document.body.appendChild(Object.assign(document.createElement("div"), { id: "toast" }));
        clearTimeout(toastTimer); el.innerText = msg; el.className = ""; toastTimer = setTimeout(() => el.className = "hidden", 3000);
    };

    function setupEventHandlers() {
        btnProtocolToggle.onclick = toggleProtocol; $("btnNewFolder").onclick = createNewFolder;
        $("btnUploadFile").onclick = dropzone.onclick = () => fileInput.click();
        btnDl.onclick = () => runSpeedTest("dl"); btnUl.onclick = () => runSpeedTest("ul"); $("btnClearHistory").onclick = clearHistory;
        fileInput.onchange = e => uploadFilesArray(e.target.files); newFolderInput.onkeydown = e => e.key === "Enter" && submitFolder();
        newFolderInput.onblur = () => setTimeout(() => newFolderInput.classList.add("hidden"), 200);
        breadcrumbs.onclick = e => { const c = e.target.closest("[data-path]"); if (c) { currentPath = c.dataset.path; loadFileList(); } };
        fileListBody.onclick = e => {
            const f = e.target.closest("[data-folder]"), dl = e.target.closest(".action-download"), del = e.target.closest(".action-delete");
            if (f) navigateTo(f.dataset.folder);
            if (dl) downloadFile(dl.dataset.file);
            if (del) {
                if (del.classList.contains("confirm-del")) deleteFile(del.dataset.file);
                else {
                    document.querySelectorAll(".action-delete").forEach(btn => btn.classList.remove("confirm-del"));
                    del.classList.add("confirm-del"); showErr("한 번 더 누르면 삭제됩니다.");
                }
            }
        };
        document.onclick = e => e.target.closest(".action-delete") || document.querySelectorAll(".confirm-del").forEach(btn => btn.classList.remove("confirm-del"));
    }
    const checkConnection = async () => {
        try { if ((await fetch("/api/status", { signal: AbortSignal.timeout(1500) })).ok) return setConnStatus(true, "ESP32-P4 연결됨"); } catch {}
        setConnStatus(false, "연결 끊김");
    };
    const initProtocolUI = () => {
        const isHttps = protoStr === 'HTTPS'; protoStatus.className = `status-badge ${isHttps ? 'online badge-https' : 'badge-http'}`;
        setHtml(protoStatus, isHttps ? `🔒 HTTPS (보안)` : `🔓 HTTP (평문)`); btnProtocolToggle.innerText = (isHttps ? "HTTP" : "HTTPS") + "로 전환";
    };
    const toggleProtocol = () => { const np = loc.port === '8000' ? '8443' : loc.port === '8443' ? '8000' : loc.port === '80' ? '443' : loc.port === '443' ? '80' : loc.port === '' ? (protoStr === 'HTTPS' ? '80' : '443') : loc.port; loc.href = (protoStr === 'HTTPS' ? 'http:' : 'https:') + '//' + loc.hostname + (np ? ':' + np : '') + loc.pathname + loc.search; };
    const api = async (url, method = "GET", body = null) => {
        const r = await fetch(url, { method, body }).catch(() => null);
        if (r && r.ok) return r;
        throw 1;
    };
    const loadFileList = async () => {
        setHtml(fileListBody, `<tr><td colspan="4" class="loading-cell">목록 로딩 중...</td></tr>`); renderBreadcrumbs();
        try { renderFileList((await (await api(apiUri())).json()).files); } catch {
            setHtml(fileListBody, `<tr><td colspan="4" class="loading-cell">목록 로드 실패</td></tr>`); showErr("파일 목록 로드 실패");
        }
    };
    function renderFileList(files) {
        if (!files.length) return setHtml(fileListBody, `<tr><td colspan="4" class="loading-cell">비어 있음</td></tr>`);
        files.sort((a, b) => b.is_dir - a.is_dir || a.name.localeCompare(b.name));
        let html = files.map(f => {
            const isDir = f.is_dir, delBtn = f.name === ".." ? "" : `<button class="action-btn action-delete" data-file="${f.name}" title="삭제"><svg><use href="#icon-trash"/></svg></button>`,
                  dlBtn = isDir ? "" : `<button class="action-btn action-download" data-file="${f.name}" title="다운로드"><svg><use href="#icon-download"/></svg></button>`;
            return `<tr><td><div class="file-name-container ${isDir ? 'clickable' : ''}" ${isDir ? `data-folder="${f.name}"` : ''}><svg class="icon-${isDir ? 'folder' : 'file'}-color"><use href="#icon-${isDir ? 'folder' : 'file'}"/></svg><span>${f.name}</span></div></td><td><span class="type-badge ${isDir ? 'type-dir' : 'type-file'}">${isDir ? 'Dir' : 'File'}</span></td><td>${isDir ? '-' : formatBytes(f.size)}</td><td><div class="actions-cell">${dlBtn + delBtn}</div></td></tr>`;
        }).join('');
        if (files.length === 1 && files[0].name === "..") html += `<tr><td colspan="4" class="loading-cell" style="border-bottom:none; color:var(--muted)">비어 있음</td></tr>`;
        setHtml(fileListBody, html);
    }
    const navigateTo = f => (currentPath = f === ".." ? currentPath.slice(0, currentPath.lastIndexOf("/")) || "/" : getFullPath(f), loadFileList());
    function renderBreadcrumbs() {
        const parts = currentPath.split("/").filter(x => x);
        setHtml(breadcrumbs, `<span class="${parts.length ? 'breadcrumb-item' : 'breadcrumb-current'}" data-path="/">📁 Root</span>` +
            parts.map((p, i) => {
                const path = "/" + parts.slice(0, i + 1).join("/");
                const active = i === parts.length - 1;
                return ` / <span class="${active ? 'breadcrumb-current' : 'breadcrumb-item'}" ${active ? '' : `data-path="${path}"`}>${p}</span>`;
            }).join(''));
    }
    const formatBytes = b => b ? (b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(1) + ' MB') : '0 B';
    const setupDragAndDrop = () => {
        const setBorder = c => dropzone.style.borderColor = c;
        dropzone.ondragover = e => (e.preventDefault(), setBorder("var(--primary)")); dropzone.ondragleave = () => setBorder("var(--border)");
        dropzone.ondrop = e => (e.preventDefault(), setBorder("var(--border)"), e.dataTransfer.files.length && uploadFilesArray(e.dataTransfer.files));
    };
    const uploadFilesArray = async files => {
        for (let file of files) {
            const fd = new FormData(); fd.append("file", file);
            try { await api(`/api/files?path=${enc(getFullPath(file.name))}`, "POST", fd); } catch { showErr("파일 업로드 실패"); break; }
        }
        fileInput.value = ""; loadFileList();
    };
    const createNewFolder = () => newFolderInput.classList.contains("hidden") ? (newFolderInput.classList.remove("hidden"), newFolderInput.focus()) : submitFolder();
    const submitFolder = async () => {
        const name = newFolderInput.value.trim(); newFolderInput.value = ""; newFolderInput.classList.add("hidden");
        if (name) { try { await fetch("/api/files", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: getFullPath(name) }) }); } catch { showErr("폴더 생성 실패"); } loadFileList(); }
    };
    const deleteFile = async name => { try { await api(apiUri(name), "DELETE"); } catch { showErr("파일 삭제 실패"); } loadFileList(); };
    const downloadFile = name => loc.href = `/api/files/content?path=${enc(getFullPath(name))}`;
    function setSpeedUIState(running, type = 'dl') {
        isTesting = running; btnDl.disabled = btnUl.disabled = running;
        testProgressBar.className = `progress-bar ${type}`; testStateText.innerText = running ? `${type === 'dl' ? '다운로드' : '업로드'} 중...` : "테스트 완료";
        if (running) { setVal(metricCurrent, "0.00"); setVal(metricMax, "0.00"); setVal(metricAvg, "0.00"); setHtml(metricStats, "0.0s <span>/ 0.0MB</span>"); }
    }
    const getHist = () => { try { return JSON.parse(localStorage.getItem("sh_" + protoStr)) || []; } catch { return []; } },
          setHist = h => { try { localStorage.setItem("sh_" + protoStr, JSON.stringify(h)); } catch {} };
    const loadHistory = () => (testHistory = getHist(), renderHistory());
    const clearHistory = () => (testHistory = [], setHist([]), renderHistory());
    function addHistoryItem(type, size, avgSpeed, maxSpeed) {
        const item = {
            protocol: protoStr, type: type === 'dl' ? '다운로드' : '업로드', size: formatBytes(size),
            avg: avgSpeed.toFixed(2), max: maxSpeed.toFixed(2), time: new Date().toTimeString().slice(0, 8)
        };
        testHistory.unshift(item); if (testHistory.length > 5) testHistory.pop();
        setHist(testHistory); renderHistory();
    }
    function renderHistory() {
        setHtml(historyList, testHistory.length === 0 
            ? `<div class="history-empty">측정 기록이 없습니다.</div>`
            : testHistory.map(item => `<div class="history-item"><span class="type-badge ${item.protocol === 'HTTPS' ? 'badge-https' : 'badge-http'}">${item.protocol}</span><span class="history-type-label ${item.type === '다운로드' ? 'type-dl' : 'type-ul'}">${item.type}</span><span class="history-size-label">(${item.size})</span><span>${item.avg} Mbps</span><span class="history-max-label">(최대 ${item.max})</span><span class="history-time-label">${item.time}</span></div>`).join('')
        );
    }
    async function runSpeedTest(type) {
        if (isTesting) return;
        const totalSize = parseInt(testSize.value) * 1048576; setSpeedUIState(true, type);
        let bytesTransferred = 0, maxSpeed = 0, currentSpeed = 0, startTime = performance.now(), lastTime = startTime, lastBytes = 0;
        const update = (bytes) => {
            bytesTransferred = bytes; const now = performance.now(), elapsed = Math.max(0.001, (now - startTime) / 1000);
            if (now - lastTime >= 100) {
                currentSpeed = ((bytesTransferred - lastBytes) * 8) / 1048576 / ((now - lastTime) / 1000);
                maxSpeed = Math.max(maxSpeed, currentSpeed); lastTime = now; lastBytes = bytesTransferred;
            }
            const progress = (bytesTransferred / totalSize) * 100, avg = (bytesTransferred * 8) / 1048576 / elapsed;
            setHtml(testProgressPercent, `${Math.round(progress)}%`), testProgressBar.style.width = `${progress}%`,
            setVal(metricCurrent, currentSpeed.toFixed(2)), setVal(metricMax, maxSpeed.toFixed(2)), setVal(metricAvg, avg.toFixed(2)),
            setHtml(metricStats, `${elapsed.toFixed(1)}s <span>/ ${(bytesTransferred / 1048576).toFixed(1)}MB</span>`);
        };
        try {
            if (type === 'dl') {
                const res = await api(`/api/speedtest/download?size=${totalSize}`), reader = res.body.getReader();
                while (true) {
                    const { done, value } = await reader.read(); if (done) break;
                    update(bytesTransferred + value.length);
                }
            } else {
                const chunk = new Uint8Array(1048576), parts = [], repeat = Math.floor(totalSize / 1048576), rem = totalSize % 1048576;
                for (let i = 0; i < repeat; i++) parts.push(chunk);
                if (rem > 0) parts.push(new Uint8Array(rem));
                const blob = new Blob(parts); let sent = 0;
                const pi = setInterval(() => { sent = Math.min(totalSize, sent + 5242880); update(sent); if (sent >= totalSize) clearInterval(pi); }, 100);
                try { await fetch("/api/speedtest/upload", { method: "POST", body: blob }); } finally { clearInterval(pi); update(totalSize); }
            }
            const elapsed = Math.max(0.001, (performance.now() - startTime) / 1000);
            if (maxSpeed === 0 && bytesTransferred > 0) {
                currentSpeed = maxSpeed = (bytesTransferred * 8) / 1048576 / elapsed;
                setVal(metricCurrent, currentSpeed.toFixed(2)); setVal(metricMax, maxSpeed.toFixed(2)); setVal(metricAvg, currentSpeed.toFixed(2));
            }
            addHistoryItem(type, totalSize, (bytesTransferred * 8) / 1048576 / elapsed, maxSpeed);
        } catch { showErr("테스트 실패"); } finally { setSpeedUIState(false, type); }
    }

    checkConnection(); initProtocolUI(); loadFileList(); setupDragAndDrop(); testHistory = getHist(); renderHistory(); setupEventHandlers(); window.onstorage = e => e.key === "sh_" + protoStr && loadHistory();
</script>
