<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M5Stack Tab5 True Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Device Mode 720x1280 최적화 */
        body {
            background-color: #000000; display: flex; justify-content: flex-start; align-items: flex-start;
            font-family: 'Inter', sans-serif; color: white; margin: 0; padding: 0;
            width: 100vw; height: 100vh; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
        }

        .screen {
            width: 720px; height: 1280px; background-color: #000000; position: relative;
            display: flex; flex-direction: column; flex-shrink: 0; scroll-snap-align: start;
        }

        svg { display: inline-block; vertical-align: middle; }

        /* =========================================
           GLOBAL COMPONENTS
           ========================================= */
        .status-bar {
            width: 100%; height: 30px; display: flex; justify-content: space-between; align-items: center;
            font-size: 16px; font-weight: 600; color: rgba(255, 255, 255, 0.9); flex-shrink: 0; padding: 0 20px;
        }
        .status-left { display: flex; align-items: center; gap: 8px; width: 120px; }
        .status-center { letter-spacing: 8px; color: white; flex-grow: 1; text-align: center; }
        .status-right { display: flex; justify-content: flex-end; align-items: center; gap: 12px; width: 120px; }

        .touchpad-area {
            width: 100%; height: 640px; background-color: #000000; position: relative; flex-shrink: 0;
        }
        .touch-hint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #222222; font-size: 24px; font-weight: 600; letter-spacing: 4px;
        }
        .corner { position: absolute; width: 40px; height: 40px; border: 2px solid #222222; }
        .c-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .c-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .c-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .c-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* =========================================
           MODE 1: PC Media (Chunky Grid)
           ========================================= */
        .m1-top {
            width: 100%; height: 640px; background-color: #000000; padding: 10px 20px 20px 20px;
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .m1-grid {
            flex-grow: 1; display: grid; gap: 15px; margin-top: 15px;
            grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
        }
        .m1-btn {
            background-color: #121212; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #888; cursor: pointer; border: 2px solid #1a1a1a;
        }
        .m1-btn-icon { margin-bottom: 12px; }
        .m1-btn-label { font-size: 16px; font-weight: 600; letter-spacing: 2px; color: #555; }
        .m1-play-btn { background-color: #1a1a1a; color: #fff; border-color: #333; }
        .m1-play-btn .m1-btn-label { color: #888; }

        /* =========================================
           MODE 2: Spotify (Fullscreen Album Art)
           ========================================= */
        .m2-top {
            width: 100%; height: 640px;
            /* 실제 앨범아트 예시 (위키미디어) */
            background-image: url('https://upload.wikimedia.org/wikipedia/en/9/9f/Bohemian_Rhapsody.png');
            background-size: cover; background-position: center;
            position: relative; padding: 10px 40px 30px 40px;
            display: flex; flex-direction: column; justify-content: flex-end; /* 컨텐츠를 하단으로 밀기 */
            flex-shrink: 0; z-index: 1;
        }
        /* 그라데이션 오버레이 (글씨 가독성 확보) */
        .m2-top::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.8) 70%, rgba(0,0,0,1) 100%);
            z-index: -1;
        }

        .m2-status-bar-absolute {
            position: absolute; top: 10px; left: 0; width: 100%; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 16px; font-weight: 600; color: rgba(255, 255, 255, 0.9);
        }

        .m2-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; }
        .m2-title { font-size: 40px; font-weight: 700; margin-bottom: 4px; line-height: 1.2; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .m2-artist { font-size: 24px; color: #d0d0d0; line-height: 1.2; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .m2-heart { color: #1DB954; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.8)); }
        
        .m2-prog { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        .m2-prog-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; }
        .m2-prog-fill { width: 30%; height: 100%; background: white; border-radius: 3px; }
        .m2-prog-time { display: flex; justify-content: space-between; font-size: 16px; color: #ccc; font-variant-numeric: tabular-nums; text-shadow: 0 1px 5px rgba(0,0,0,0.8); }
        
        .m2-ctrl { display: flex; justify-content: space-between; align-items: center; padding: 0 10px;}
        .m2-btn { 
            color: white; cursor: pointer; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8)); 
            padding: 20px; box-sizing: content-box; /* 투명한 터치 영역(Hit-box) 대폭 확장 */
        }
        .m2-btn.dim { color: #b3b3b3; }
        .m2-play {
            width: 80px; height: 80px; background: white; border-radius: 50%;
            color: black; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* =========================================
           MODE 3: Numpad & Calculator
           ========================================= */
        .m3-top { 
            width: 100%; height: 384px; background-color: #121212; padding: 10px 40px 20px 40px; 
            display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0;
        }
        .m3-toggle {
            align-self: flex-start; background: #2C2C2C; padding: 16px 24px; border-radius: 30px;
            font-size: 18px; color: #1DB954; border: 1px solid #1DB954; font-weight: 600; cursor: pointer;
        }
        .m3-result-area { display: flex; flex-direction: column; align-items: flex-end; }
        .m3-history { font-size: 32px; color: #888; margin-bottom: 10px; }
        .m3-result { font-size: 80px; font-weight: 300; letter-spacing: 2px; }
        
        .m3-matrix {
            width: 100%; height: 896px; background-color: #121212; padding: 10px 10px; display: grid; gap: 4px; flex-shrink: 0;
            grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); 
        }
        .btn {
            background-color: #2C2C2C; border-radius: 12px; display: flex; justify-content: center;
            align-items: center; font-size: 48px; font-weight: 400; color: white; cursor: pointer;
        }
        .btn-op { background-color: #FF9F0A; font-weight: 600; }
        .btn-fn { background-color: #A5A5A5; color: black; font-weight: 600; }
        .btn-zero { grid-column: span 2; }
        .btn-enter { grid-row: span 2; background-color: #FF9F0A; }
        .icon-backspace { width: 36px; height: 36px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    </style>
</head>
<body>

    <svg style="display:none;">
        <symbol id="icon-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect><line x1="22" y1="11" x2="22" y2="13"></line></symbol>
        <symbol id="icon-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></symbol>
        <symbol id="icon-ble" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"></polyline></symbol>
        <symbol id="icon-prev" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></symbol>
        <symbol id="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></symbol>
        <symbol id="icon-playpause" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="3 4 12 12 3 20"></polygon>
            <rect x="15" y="4" width="3" height="16"></rect>
            <rect x="20" y="4" width="3" height="16"></rect>
        </symbol>
        <symbol id="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></symbol>
        <symbol id="icon-next" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></symbol>
        <symbol id="icon-voldown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></symbol>
        <symbol id="icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></symbol>
        <symbol id="icon-volup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></symbol>
        <symbol id="icon-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></symbol>
        <symbol id="icon-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></symbol>
        <symbol id="icon-heart" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></symbol>
        <symbol id="icon-backspace" viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></symbol>
    </svg>

    <!-- ================= MODE 1 ================= -->
    <div class="screen">
        <div class="m1-top">
            <div class="status-bar" style="padding: 0 0;">
                <div class="status-left"><svg width="24" height="24"><use href="#icon-battery"></use></svg> <span>100%</span></div>
                <div class="status-center">● ○ ○</div>
                <div class="status-right"><svg width="20" height="20"><use href="#icon-wifi"></use></svg> <svg width="20" height="20"><use href="#icon-ble"></use></svg></div>
            </div>
            <div class="m1-grid">
                <div class="m1-btn"><svg class="m1-btn-icon" width="48" height="48"><use href="#icon-prev"></use></svg><div class="m1-btn-label">PREV</div></div>
                <div class="m1-btn m1-play-btn"><svg class="m1-btn-icon" width="48" height="48"><use href="#icon-playpause"></use></svg><div class="m1-btn-label">PLAY/PAUSE</div></div>
                <div class="m1-btn"><svg class="m1-btn-icon" width="48" height="48"><use href="#icon-next"></use></svg><div class="m1-btn-label">NEXT</div></div>
                <div class="m1-btn"><svg class="m1-btn-icon" width="48" height="48"><use href="#icon-voldown"></use></svg><div class="m1-btn-label">VOL -</div></div>
                <div class="m1-btn"><svg class="m1-btn-icon" width="48" height="48"><use href="#icon-mute"></use></svg><div class="m1-btn-label">MUTE</div></div>
                <div class="m1-btn"><svg class="m1-btn-icon" width="48" height="48"><use href="#icon-volup"></use></svg><div class="m1-btn-label">VOL +</div></div>
            </div>
        </div>
        <div class="touchpad-area">
            <div class="corner c-tl"></div><div class="corner c-tr"></div>
            <div class="corner c-bl"></div><div class="corner c-br"></div>
            <div class="touch-hint">TOUCHPAD</div>
        </div>
    </div>

    <!-- ================= MODE 2 ================= -->
    <div class="screen">
        <div class="m2-top">
            <!-- 상태바는 배경 위에 뜨도록 Absolute 처리 -->
            <div class="m2-status-bar-absolute">
                <div class="status-left"><svg width="24" height="24"><use href="#icon-battery"></use></svg> <span>100%</span></div>
                <div class="status-center">○ ● ○</div>
                <div class="status-right"><svg width="20" height="20"><use href="#icon-wifi"></use></svg> <svg width="20" height="20"><use href="#icon-ble"></use></svg></div>
            </div>
            
            <!-- 곡 정보 (배경이 앨범아트이므로 하단으로 밀착) -->
            <div class="m2-info">
                <div><div class="m2-title">Bohemian Rhapsody</div><div class="m2-artist">Queen</div></div>
                <svg class="m2-heart" width="36" height="36"><use href="#icon-heart"></use></svg>
            </div>
            <div class="m2-prog">
                <div class="m2-prog-bar"><div class="m2-prog-fill"></div></div>
                <div class="m2-prog-time"><span>2:14</span><span>5:55</span></div>
            </div>
            <div class="m2-ctrl">
                <svg class="m2-btn dim" width="32" height="32"><use href="#icon-shuffle"></use></svg>
                <svg class="m2-btn" width="36" height="36"><use href="#icon-prev"></use></svg>
                <div class="m2-play"><svg width="36" height="36"><use href="#icon-pause"></use></svg></div>
                <svg class="m2-btn" width="36" height="36"><use href="#icon-next"></use></svg>
                <svg class="m2-btn dim" width="32" height="32"><use href="#icon-repeat"></use></svg>
            </div>
        </div>
        <div class="touchpad-area">
            <div class="corner c-tl"></div><div class="corner c-tr"></div>
            <div class="corner c-bl"></div><div class="corner c-br"></div>
            <div class="touch-hint">TOUCHPAD</div>
        </div>
    </div>

    <!-- ================= MODE 3 ================= -->
    <div class="screen">
        <div class="m3-top">
            <div class="status-bar" style="padding: 0 0;">
                <div class="status-left"><svg width="24" height="24"><use href="#icon-battery"></use></svg> <span>100%</span></div>
                <div class="status-center">○ ○ ●</div>
                <div class="status-right"><svg width="20" height="20"><use href="#icon-wifi"></use></svg> <svg width="20" height="20"><use href="#icon-ble"></use></svg></div>
            </div>
            <div class="m3-toggle">Numpad</div>
            <div class="m3-result-area">
                <div class="m3-history">12,345 + 6,789 =</div>
                <div class="m3-result">19,134</div>
            </div>
        </div>
        <div class="m3-matrix">
            <!-- Row 1 -->
            <div class="btn btn-fn">C</div><div class="btn btn-op">/</div><div class="btn btn-op">*</div><div class="btn btn-op"><svg class="icon-backspace"><use href="#icon-backspace"></use></svg></div>
            <!-- Row 2 -->
            <div class="btn">7</div><div class="btn">8</div><div class="btn">9</div><div class="btn btn-op">-</div>
            <!-- Row 3 -->
            <div class="btn">4</div><div class="btn">5</div><div class="btn">6</div><div class="btn btn-op">+</div>
            <!-- Row 4 -->
            <div class="btn">1</div><div class="btn">2</div><div class="btn">3</div><div class="btn btn-enter">↵</div>
            <!-- Row 5 -->
            <div class="btn btn-zero">0</div><div class="btn">.</div>
        </div>
    </div>

</body>
</html>
